name: Routing index

# wiki/ROUTING.md and wiki/manifest.json are generated from page frontmatter.
# On a PR we assert they are current; on main we regenerate and fan the index out to
# every code repo so agents there can pick a page without fetching the whole wiki.
#
# See https://tech.helloally.ai/#/wiki/contributing/docs-system.md

on:
  pull_request:
    paths: ["wiki/**", "scripts/gen-routing.py"]
  push:
    branches: [main]
    paths: ["wiki/**", "scripts/gen-routing.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert generated index is current
        run: python3 scripts/gen-routing.py --check

  distribute:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [ally-be, ally-ai, ally-ai-learn, ally-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate index
        run: python3 scripts/gen-routing.py

      # A short-lived installation token, scoped to just this matrix repo. Not a PAT: the
      # PRs are authored by ally-docs-bot[bot], so nobody's contribution graph carries
      # work they didn't do, and a human can still approve them.
      - name: Mint a token for the target repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
          owner: HelloAllyTech
          repositories: ${{ matrix.repo }}

      - name: Check out target repo
        uses: actions/checkout@v4
        with:
          repository: helloallytech/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Copy index and open a PR if it changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          cp wiki/ROUTING.md "target/WIKI-ROUTING.md"
          cd target

          if git diff --quiet -- WIKI-ROUTING.md; then
            echo "No change for $TARGET."
            exit 0
          fi

          BRANCH="chore/sync-wiki-routing-${GITHUB_SHA::7}"
          # The App's own noreply address, so the commit links to ally-docs-bot[bot]
          # instead of showing as an unattributed ghost author.
          git config user.name  "ally-docs-bot[bot]"
          git config user.email "314168265+ally-docs-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add WIKI-ROUTING.md
          git commit -m "chore: sync wiki routing index

          Generated from wiki page frontmatter at helloallytech.github.io@${GITHUB_SHA::7}.
          Do not edit by hand — edit the page frontmatter instead."
          git push -u origin "$BRANCH"

          PR_URL="$(gh pr create \
            --title "chore: sync wiki routing index" \
            --body "Regenerated \`WIKI-ROUTING.md\` from wiki page frontmatter at \
          helloallytech.github.io@\`${GITHUB_SHA::7}\`.

          This file is generated. To change it, edit the frontmatter of the wiki page it
          describes — see [the docs system](https://tech.helloally.ai/#/wiki/contributing/docs-system.md).

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" \
            --label "docs:skip" \
            --head "$BRANCH")"

          # Nobody can meaningfully review a regenerated index, and a standing queue of
          # rubber-stamp PRs teaches people to merge docs changes without reading them.
          # --auto only applies where something blocks the merge; where nothing does,
          # GitHub rejects it and we merge outright.
          gh pr merge --auto --squash --delete-branch "$PR_URL" 2>/dev/null \
            || gh pr merge --squash --delete-branch "$PR_URL" 2>/dev/null \
            || echo "::warning::Could not merge $PR_URL automatically — merge it by hand."

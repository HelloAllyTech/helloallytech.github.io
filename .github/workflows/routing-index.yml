name: Routing index

# wiki/ROUTING.md and wiki/manifest.json are generated from page frontmatter.
# On a PR we assert they are current; on main we regenerate and fan the index out to
# every code repo so agents there can pick a page without fetching the whole wiki.
#
# See https://tech.helloally.ai/#/wiki/contributing/docs-system.md

on:
  pull_request:
    paths: ["wiki/**", "scripts/gen-routing.py"]
  push:
    branches: [main]
    paths: ["wiki/**", "scripts/gen-routing.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert generated index is current
        run: python3 scripts/gen-routing.py --check

  distribute:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [ally-be, ally-ai, ally-ai-learn, ally-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate index
        run: python3 scripts/gen-routing.py

      # A short-lived installation token, scoped to just this matrix repo. Not a PAT: the
      # commits are authored by ally-docs-bot[bot], so nobody's contribution graph carries
      # work they didn't do.
      - name: Mint a token for the target repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
          owner: HelloAllyTech
          repositories: ${{ matrix.repo }}

      - name: Check out target repo
        uses: actions/checkout@v4
        with:
          repository: helloallytech/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Copy index and push it if it changed
        env:
          TARGET: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          cp wiki/ROUTING.md "target/WIKI-ROUTING.md"
          cd target

          if git diff --quiet -- WIKI-ROUTING.md; then
            echo "No change for $TARGET."
            exit 0
          fi

          # The App's own noreply address, so the commit links to ally-docs-bot[bot]
          # instead of showing as an unattributed ghost author.
          git config user.name  "ally-docs-bot[bot]"
          git config user.email "314168265+ally-docs-bot[bot]@users.noreply.github.com"
          git add WIKI-ROUTING.md
          git commit -m "chore: sync wiki routing index

          Generated from wiki page frontmatter at helloallytech.github.io@${GITHUB_SHA::7}.
          Do not edit by hand — edit the page frontmatter instead."

          # Straight to the default branch, no pull request. Nobody can meaningfully review
          # a regenerated index, and a standing queue of rubber-stamp PRs teaches people to
          # merge docs changes without reading them.
          #
          # This is allowed because ally-docs-bot holds a required-pull-request bypass on
          # the protected branches. That bypass is part of this mechanism, not a stray
          # setting: drop it and every sync below starts failing.
          #
          # It used to open a PR and arm auto-merge instead. That can never land on a repo
          # that requires a review, because an App cannot approve its own pull request —
          # it quietly queued 19 superseded snapshots of this file in each protected repo
          # before anyone noticed.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3; do
            if push_log="$(git push origin "HEAD:$BRANCH" 2>&1)"; then
              echo "Pushed the index to $TARGET@$BRANCH on attempt $attempt."
              exit 0
            fi
            echo "::notice::push to $TARGET rejected on attempt $attempt; rebasing onto the new tip"
            git pull --rebase --quiet origin "$BRANCH" || break
          done

          # Fail loudly rather than falling back to a PR. The previous shape sent both of
          # its merge attempts to /dev/null and emitted a ::warning::, which does not fail
          # the job — so twelve days of green runs hid a growing queue. A branch that
          # cannot be pushed is a broken bypass or a protection change, and both want a
          # human, not a PR nobody will merge.
          echo "::error::Could not push the routing index to $TARGET — $push_log"
          exit 1
